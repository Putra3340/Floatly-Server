name: Build Floatly-Server (.NET 9 - Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    env:
      DOTNET_VERSION: 9.0.x
      SOLUTION_PATH: Floatly-Server.sln
      PROJECT_PATH: Floatly-Server.csproj

    steps:
      - name: 💕 Checkout repository
        uses: actions/checkout@v4

      - name: 💿 Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🧰 Install LibMan CLI
        run: dotnet tool install -g Microsoft.Web.LibraryManager.Cli

      - name: 🔧 Add .NET tools to PATH
        run: echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 📦 Restore dependencies
        run: |
          dotnet restore ${{ env.SOLUTION_PATH }}
          libman restore

      - name: 🧱 Build project
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: 🧪 Run tests (if any)
        run: dotnet test --no-build --verbosity normal || echo "No tests found"

      - name: 🚀 Publish build output
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ./publish

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Floatly-Server-publish
          path: ./publish
