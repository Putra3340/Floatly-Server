name: Build & Publish Docker Image - Floatly-Server (.NET 9)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # allows manual runs too

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: floatly-server
      DOTNET_VERSION: 9.0
      DOCKERFILE_PATH: ./Dockerfile

    steps:
      - name: 💕 Checkout repository
        uses: actions/checkout@v4

      - name: 🐋 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧱 Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

      - name: 📜 Display built image details
        run: docker images ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
